# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: xcode-26.6

common_params:
  - &common_plugins
    - automattic/a8c-ci-toolkit#7.1.1

steps:
  #################
  # Build and Test
  #################
  - label: "Build and Test"
    key: test
    command: |
      xcodebuild -downloadComponent MetalToolchain || true
      install_gems
      restore_swiftpm_cache --package-resolved ExampleSPM/KanvasExample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      bundle exec fastlane test
      save_swiftpm_cache --package-resolved ExampleSPM/KanvasExample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    plugins: *common_plugins
    artifact_paths:
      - "artifacts/**/*"
